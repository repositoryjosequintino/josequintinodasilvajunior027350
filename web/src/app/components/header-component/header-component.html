<header class="sticky top-0 z-50 bg-white shadow-md border-b border-gray-200">

  <div class="container mx-auto px-4">

    <div class="flex items-center justify-between h-16">

      <div class="flex items-center space-x-3">

        <div class="flex items-center text-gray-900">
          <mat-icon class="text-2xl text-[#1b3282]">music_note</mat-icon>
          <span class="ml-2 text-xl font-bold tracking-tight cursor-pointer">SEPLAGMT</span>
        </div>

        <div class="h-6 w-px bg-gray-300"></div>

        <nav class="hidden md:flex items-center space-x-1">
          
          <a mat-button routerLink="/dashboard" routerLinkActive="bg-gray-200"
            class="text-gray-700 hover:bg-gray-100 rounded-lg">
            <mat-icon>dashboard</mat-icon>
            Principal
          </a>

          <a mat-button routerLink="/artista" routerLinkActive="bg-gray-200" class="text-gray-700 hover:bg-gray-100 rounded-lg">
            <mat-icon>people</mat-icon>
            Artistas
          </a>

          <a mat-button routerLink="/albuns" routerLinkActive="bg-gray-200"
            class="text-gray-700 hover:bg-gray-100 rounded-lg">
            <mat-icon>library_music</mat-icon>
            Álbuns
          </a>
          
        </nav>
      </div>

      <div class="flex items-center space-x-4">

        <div class="relative transition-all duration-300 ease-out w-64 focus-within:w-150">
          <input type="text" placeholder="Buscar artistas, álbuns..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#1b3282]/40">
          <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
            search
          </mat-icon>
        </div>

        <button mat-icon-button class="text-gray-700 hover:bg-gray-100 rounded-full" [matBadge]="0"
          matBadgeColor="warn" matBadgeSize="small">
          <mat-icon>notifications</mat-icon>
        </button>

        <div class="h-6 w-px bg-gray-300 hidden md:block"></div>

        <div class="flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer
         hover:bg-gray-100 select-none" [matMenuTriggerFor]="userMenu">

          <div class="relative shrink-0">
            <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center">
              <mat-icon class="text-gray-700">person</mat-icon>
            </div>
            <span class="absolute -bottom-1 -right-1 w-3 h-3
             bg-green-500 rounded-full border-2 border-white">
            </span>
          </div>

          <div class="hidden md:flex flex-col text-left leading-tight">
            <span class="text-sm font-medium text-gray-900 truncate">
              {{ 'José Quintinno da Silva Júnior' }}
            </span>
            <span class="text-xs text-gray-500 truncate">
              {{ 'Administrador' }}
            </span>
          </div>

          <mat-icon class="text-gray-500 shrink-0">
            arrow_drop_down
          </mat-icon>
        </div>

      </div>
    </div>
  </div>
</header>

<mat-menu #userMenu="matMenu" xPosition="before">

  <div class="p-2">

    <button mat-menu-item routerLink="/perfil">
      <mat-icon>account_circle</mat-icon>
      Meu Perfil
    </button>

    <button mat-menu-item routerLink="/configuracoes">
      <mat-icon>settings</mat-icon>
      Configurações
    </button>

    <div class="border-t mt-2 pt-2">
      <button mat-menu-item class="text-red-600 hover:bg-red-50" (click)="null">
        Sair
      </button>
    </div>

  </div>

</mat-menu>
