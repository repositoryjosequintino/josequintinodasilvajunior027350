<div class="min-h-96 bg-gray-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-md">

        <div class="border-b border-gray-200 px-6 py-4">
            <h2 class="text-xl font-semibold text-gray-800 text-center">
                Cadastro de Artista
            </h2>
        </div>

        <div class="p-6">

            <form [formGroup]="formGroup" (ngSubmit)="create()" class="space-y-6">

                <div>
                    <label for="nome-artista" class="block text-sm font-medium text-gray-700 mb-1">
                        Nome do Artista
                    </label>

                    <input id="nome-artista" type="text" formControlName="nome" placeholder="Digite o nome artístico"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        [class.border-red-500]="formGroup.get('nome')?.invalid && formGroup.get('nome')?.touched" />

                    <p class="text-sm text-gray-500 mt-2">
                        Nome usado em apresentações públicas
                    </p>

                    <div *ngIf="formGroup.get('nome')?.invalid && formGroup.get('nome')?.touched"
                        class="text-sm text-red-600 mt-1">
                        Nome é obrigatório
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-4">
                    <button type="submit" [disabled]="formGroup.invalid"
                        class="flex-1 px-4 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition cursor-pointer">
                        Cadastrar
                    </button>

                    <button type="button" routerLink="/"
                        class="flex-1 px-4 py-3 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition cursor-pointer">
                        Cancelar
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
