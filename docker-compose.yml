services:
  postgres:
    image: postgres:15
    container_name: seplagmt_database
    restart: always
    environment:
      POSTGRES_DB: db_seplagmt_desenvolvimento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: seplagmt_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  seplag-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: seplagmt_api
    restart: always
    depends_on:
      - postgres
      - minio
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_seplagmt_desenvolvimento
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: "@SeplagMTAssinaturaSeplagService1"
      MAIL_USERNAME: repository.desenvolvimento@gmail.com
      MAIL_PASSWORD: ittd bwhj iiob terk

volumes:
  postgres_data:
  minio_data:
